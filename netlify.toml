[build]
  publish = "."
  command = ""

# Correct MIME for webmanifest (some validators require it)
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback - keep PWA navigations on index/app (optional, SW handles offline)
# Uncomment if you use client-side routing
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
